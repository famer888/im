<!DOCTYPE html>
<html lang="en" style="position: fixed; bottom: 0; right: 0;">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' local-resource: native-image: http: https: data: blob:; media-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Child Window</title>
  <style>
    body {
      margin: 0;
    }

    #list-container {
      list-style-type: none;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    #list-container li {
      margin-top: 10px;
      padding: 10px 9px;
      background-color: #fff;
      box-sizing: border-box;
      position: relative;
      width: 278px;
      cursor: default;
      border: 1px solid #e5e5e5;
      border-radius: 10px 0 10px 10px;
    }
    .img-box {
      height: 44px;
      width: 44px;
      margin-right: 10px;
    }

    #list-container li .avatar {
      border-radius: 50%;
      height: 44px;
      width: 44px;
    }

    .info-box {
      display: flex;
      align-items: center;
      width: 100%;
    }

    #list-container li .info {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .nickname-box {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    
    .nickname {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 180px;
      font-size: 14px;
      display: block;
    }

    .group-chat-icon {
      height: 16px;
      margin-right: 4px;
    }

    #list-container li .info .text-content {
      font-size: 12px;
      line-height: 16px;
      color: #999999;
      width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }

    .close-item {
      position: absolute;
      right: 10px;
      top: 12px;
      width: 12px;
      height: 12px;
      cursor: pointer;
    }

    .hid-all {
      width: 100%;
      height: 30px;
      line-height: 30px;
      color: #008DFF;
      font-size: 12px;
      text-align: center;
      background-color: #fff;
      display: none;
      cursor: pointer;
      border: 1px solid #e5e5e5;
      box-sizing: border-box;
    }

    .hid-all:hover {
      background-color: #DEECF5;
      border-color: #DEECF5;
    }

    .user-name {
      color: #FB9E3E;
      font-size: 12px;
    }

    .emoji-item {
      height: 18px;
      position: relative;
      top: 4px;
    }

    .reply-button {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: none;
      cursor: pointer;
      background: #008DFF;
      color: #fff;
      border-radius: 99px;
      border: none;
      width: 50px;
      height: 24px;
      font-size: 12px;
      box-shadow: 1px 0px 10px rgb(0 0 0 / 28%);
    }

    #list-container li:hover .reply-button {
      display: block;
    }

    .reply-form {
      width: 100%;
      display: none;
      align-items: center;
    }

    .reply-form-button {
      margin-right: 10px;
      background: #008DFF;
      color: #fff;
      border-radius: 99px;
      border: none;
      cursor: pointer;
      width: 50px;
      height: 24px;
      font-size: 12px;
      box-shadow: 1px 0px 10px rgb(0 0 0 / 28%);
    }

    .reply-input {
      width: 100%;
      min-height: 20px;
      max-height: 50px;
      overflow-y: hidden;
      box-sizing: border-box;
      resize: none;
      margin: 5px 10px 0;
      border-color: #e5e5e5;
      /* outline-color: #FB9E3E !important; */
      outline: none !important;
    }

    .msg-type-icon {
      height: 16px;
      position: relative;
      top: 2px;
    }

    .msg-type-name {
      color: #000;
    }
  </style>
</head>

<body>
  <div id="notice-main">
    <div class="hid-all" id="hidAll">隐藏全部</div>
    <ul id="list-container"></ul>
  </div>
  <script type="module" src="notification-app.js"></script>
</body>

</html>

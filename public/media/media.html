<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media</title>
  <link rel="stylesheet" href="css/plyr.min.css">
  <style>
    body { margin: 0; background: rgba(0,0,0,0.65); color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
    .titlebar { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: flex-end; -webkit-app-region: drag; height: 32px; align-items: center; z-index: 100; }
    .titlebar-btn { -webkit-app-region: no-drag; width: 46px; height: 32px; border: none; background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .titlebar-btn svg { fill: none; stroke: #aaa; stroke-width: 1.5; width: 16px; height: 16px; }
    .titlebar-btn:hover svg { stroke: #fff; }
    .titlebar-btn.close:hover { background: #e81123; }
    .titlebar-btn.close:hover svg { stroke: #fff; }
    .bottom-actions { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; z-index: 100; }
    .action-btn { width: 40px; height: 40px; border: none; background: rgba(255,255,255,0.1); border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .action-btn svg { stroke: #aaa; width: 20px; height: 20px; }
    .action-btn:hover { background: rgba(255,255,255,0.2); }
    .action-btn:hover svg { stroke: #fff; }
    .media-layer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center; }
    .media-layer.active { display: flex; }
    #image-layer { overflow: hidden; }
    #img-wrap { display: inline-flex; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    #image-layer img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    #video-layer { background: transparent; }
    #video-layer .plyr { width: 100%; height: 100%; }
    #video-layer video { width: 100%; height: 100%; object-fit: contain; }
    .plyr--video { --plyr-color-main: #7b8aff; --plyr-video-background: transparent; background: transparent; }
    .plyr__controls { position: absolute !important; bottom: 24px !important; left: 50% !important; transform: translateX(-50%) !important; width: 70% !important; max-width: 600px !important; border-radius: 12px !important; background: rgba(0,0,0,0.55) !important; backdrop-filter: blur(8px) !important; padding: 6px 12px !important; }
  </style>
</head>

<body>
  <div class="titlebar">
    <button class="titlebar-btn minimize" onclick="window.electronAPI?.minimize?.()"><svg viewBox="0 0 16 16"><line x1="3" y1="8" x2="13" y2="8"/></svg></button>
    <button class="titlebar-btn maximize" onclick="toggleMaximize()"><svg id="max-icon" viewBox="0 0 16 16"><path d="M5 3h8v8M3 5h8v8H3z" fill="none" stroke-width="1.5"/></svg></button>
    <button class="titlebar-btn close" onclick="window.electronAPI?.close?.()"><svg viewBox="0 0 16 16"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></button>
  </div>
  <div id="image-layer" class="media-layer">
  </div>
  <div id="video-layer" class="media-layer">
    <video id="video-player" preload="metadata"></video>
  </div>
  <div style="position:fixed;top:36px;left:12px;z-index:100;display:flex;gap:6px;">
    <button onclick="mediaView.init('test.jpg',window.MediaType.IMAGE)" style="padding:4px 10px;border:none;border-radius:6px;background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;font-size:12px;">Test Image</button>
    <button onclick="mediaView.init('test.mp4',window.MediaType.VIDEO)" style="padding:4px 10px;border:none;border-radius:6px;background:rgba(255,255,255,0.15);color:#fff;cursor:pointer;font-size:12px;">Test Video</button>
  </div>
  <div class="bottom-actions">
    <button class="action-btn" title="Rotate" onclick="mediaView.rotate()"><svg viewBox="0 0 24 24" fill="none"><path d="M11.5 20.5C6.80558 20.5 3 16.6944 3 12C3 7.30558 6.80558 3.5 11.5 3.5C16.1944 3.5 20 7.30558 20 12C20 13.5433 19.5887 14.9905 18.8698 16.238M22.5 15L18.8698 16.238M17.1747 12.3832L18.5289 16.3542L18.8698 16.238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="action-btn" title="Save As" onclick="mediaView.saveAs()"><svg viewBox="0 0 24 24" fill="none"><path d="M3,12.3v7a2,2,0,0,0,2,2H19a2,2,0,0,0,2-2v-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="7.9 12.3 12 16.3 16.1 12.3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="12" x2="12" y1="2.7" y2="14.2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <script src="js/plyr.min.js"></script>
  <script src="js/wheel-zoom.min.js"></script>
  <script src="media-state.js"></script>
  <script>
    let isMaximized = true;
    const maxIcon = document.getElementById('max-icon');
    const svgRestore = '<path d="M5 3h8v8M3 5h8v8H3z" fill="none" stroke-width="1.5"/>';
    const svgMaximize = '<rect x="3" y="3" width="10" height="10" rx="1.5" fill="none" stroke-width="1.5"/>';
    function toggleMaximize() { window.electronAPI?.maximize?.(); isMaximized = !isMaximized; maxIcon.innerHTML = isMaximized ? svgRestore : svgMaximize; }

    const videoPlayer = new Plyr('#video-player', {
      controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
      tooltips: { controls: false, seek: true },
      invertTime: false
    });

    const mediaView = {
      _rotation: 0,
      _wz: null,
      _src: '',
      _mediaType: '',
      _naturalWidth: 0,
      _naturalHeight: 0,

      init(src, mediaType, width, height) {
        this._src = src;
        this._mediaType = mediaType;
        this._naturalWidth = width || 0;
        this._naturalHeight = height || 0;
        this._rotation = 0;

        const imageLayer = document.getElementById('image-layer');
        const videoLayer = document.getElementById('video-layer');

        if (mediaType === window.MediaType.IMAGE) {
          imageLayer.classList.add('active');
          videoLayer.classList.remove('active');
          if (this._wz) { this._wz.destroy(); this._wz = null; }
          imageLayer.innerHTML = '<div id="img-wrap"><img /></div>';
          const img = imageLayer.querySelector('img');
          img.src = src;
          if (width) img.setAttribute('data-width', width);
          if (height) img.setAttribute('data-height', height);
          this._wz = WZoom.create('#img-wrap img', { minScale: 1, maxScale: 3, speed: 2, zoomOnClick: false, zoomOnDblClick: false });
        } else if (mediaType === window.MediaType.VIDEO) {
          videoLayer.classList.add('active');
          imageLayer.classList.remove('active');
          if (this._wz) { this._wz.destroy(); this._wz = null; }
          imageLayer.innerHTML = '';
          videoPlayer.source = { type: 'video', sources: [{ src: src }] };
        }
      },

      _getImg() { return document.querySelector('#image-layer img'); },

      rotate() { const wrap = document.getElementById('img-wrap'); if (!wrap) return; this._rotation += 90; wrap.style.transform = `rotate(${this._rotation}deg)`; },

      async saveAs() {
        const src = this._src;
        if (!src) return;
        const filePath = src.startsWith('file://') ? decodeURIComponent(src.replace(/^file:\/\/\/?/, '')) : src;
        window.electronAPI?.saveAs(filePath);
      },

      setSize(width, height) {
        this._naturalWidth = width;
        this._naturalHeight = height;
      }
    };

    (function initFromState() {
      const state = window.mediaState?.get();
      if (!state || !state.url) return;
      mediaView.init(state.url, state.mediaType, state.width, state.height);
    })();
  </script>
</body>

</html>

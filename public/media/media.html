<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' local-resource: http: https: data: blob:; media-src 'self' local-resource: http: https: blob:; connect-src 'self' local-resource: http: https:; font-src 'self'; object-src 'none'; base-uri 'self'">
  <title>媒体</title>
  <link rel="stylesheet" href="css/plyr.min.css">
  <link rel="stylesheet" href="css/js-preview-docx.css">
  <link rel="stylesheet" href="css/js-preview-excel.css">
  <link rel="stylesheet" href="media.css">
</head>

<body>
  <div class="titlebar">
    <span id="media-type-label" class="titlebar-label" aria-live="polite"></span>
    <div class="titlebar-actions">
      <button class="titlebar-btn minimize"><svg viewBox="0 0 16 16"><line x1="3" y1="8" x2="13" y2="8"/></svg></button>
      <button class="titlebar-btn maximize"><svg id="max-icon" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="none" stroke-width="1.5"/></svg></button>
      <button class="titlebar-btn close"><svg viewBox="0 0 16 16"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></button>
    </div>
  </div>
  <div id="image-layer" class="media-layer">
  </div>
  <div id="video-layer" class="media-layer">
    <div id="video-wrap">
      <video id="video-player" preload="metadata"></video>
    </div>
  </div>
  <div id="file-layer" class="media-layer">
    <div id="file-name-label" class="file-name-label" aria-live="polite"></div>
    <div id="file-preview-docx" class="file-preview-mount"></div>
    <div id="file-preview-excel" class="file-preview-mount"></div>
    <div id="file-preview-pdf" class="file-preview-mount"></div>
  </div>
  <div id="media-file-path" class="media-file-path" aria-label="文件路径"></div>
  <div class="bottom-actions">
    <button id="rotate-btn" class="action-btn" title="Rotate"><svg viewBox="0 0 24 24" fill="none"><path d="M11.5 20.5C6.80558 20.5 3 16.6944 3 12C3 7.30558 6.80558 3.5 11.5 3.5C16.1944 3.5 20 7.30558 20 12C20 13.5433 19.5887 14.9905 18.8698 16.238M22.5 15L18.8698 16.238M17.1747 12.3832L18.5289 16.3542L18.8698 16.238" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="open-default-app-btn" class="action-btn-text" title="使用默认应用打开"><svg viewBox="0 0 20 20"><path d="M10 3.778a6.222 6.222 0 1 0 3.726 11.205l-4.869-4.869v2.208a.889.889 0 0 1-1.778 0V7.968c0-.49.398-.889.89-.889h4.353a.889.889 0 0 1 0 1.778h-2.208l4.87 4.87A6.193 6.193 0 0 0 16.221 10 6.222 6.222 0 0 0 10 3.778ZM2 10a8 8 0 1 1 16 0 8 8 0 0 1-16 0Z"/></svg>使用默认应用打开</button>
  </div>
  <script src="js/plyr.min.js"></script>
  <script src="js/wheel-zoom.min.js"></script>
  <script src="js/js-preview-docx.umd.js"></script>
  <script src="js/js-preview-excel.umd.js"></script>
  <script src="js/pdf.min.js"></script>
  <script src="js/js-preview-pdf.umd.js"></script>
  <script src="media-state.js"></script>
  <script src="media.js"></script>
</body>

</html>
